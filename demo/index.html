<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>navi-arrow · AR 步行导航演示</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0d12; overflow: hidden; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* iPhone 390×844 竖屏模拟 */
    #phone {
      position: relative;
      width: 390px; height: 844px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
      touch-action: none;
    }
    @media (max-height: 900px) { #phone { transform: scale(calc(100vh / 880)); transform-origin: center; } }
    #bg, #cam {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #cam { display: none; background: #000; }
    #navi { position: absolute; inset: 0; z-index: 2; }
    /* 演示页 chrome：模式切换按钮（在组件外） */
    #modeBar {
      position: fixed; top: 12px; left: 12px; z-index: 60;
      display: flex; gap: 8px;
    }
    #modeBar button {
      border: none; border-radius: 18px; padding: 8px 16px;
      background: rgba(20,26,36,.85); color: #fff; font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
      cursor: pointer;
    }
    #modeBar button.active { background: #2F7BFF; }
    #modeMsg {
      position: fixed; top: 52px; left: 12px; z-index: 60;
      color: #ffb4b4; font-size: 12px; max-width: 300px;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    #hint {
      position: absolute; bottom: 96px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,.85); font-size: 12px; z-index: 5;
      text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
    }
    .lil-gui { z-index: 50 !important; --width: 260px; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="phone">
      <div id="bg"></div>
      <video id="cam" autoplay muted playsinline></video>
      <div id="navi"></div>
      <div id="hint">桌面端：按住拖拽 = 转头 · 空格 = 重新播放</div>
    </div>
  </div>
  <div id="modeBar">
    <button id="btnStreet" class="active">街景</button>
    <button id="btnHospital">医院室内</button>
    <button id="btnCam">相机实景</button>
  </div>
  <div id="modeMsg"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
