<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>navi-arrow · AR 步行导航演示</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* iPhone 390pt 模拟框（桌面端） */
    #phone {
      position: relative;
      width: 390px; height: 100%;
      max-height: 844px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
    }
    @media (max-width: 500px) { #phone { width: 100%; max-height: none; } }
    #cam {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #fallback {
      position: absolute; inset: 0; z-index: 0;
      background:
        linear-gradient(180deg, #9fb6c9 0%, #b9c6d2 34%, #6d7f8e 34.2%, #4e5d6a 78%, #3a4550 100%);
    }
    #fallback .wall {
      position: absolute; top: 34%; bottom: 0; left: 0; right: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 90px),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.28));
    }
    #fallback .floor-persp {
      position: absolute; top: 70%; left: 50%; width: 200%; height: 200%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 3px, transparent 3px 110px);
    }
    #navi { position: absolute; inset: 0; z-index: 2; }
    #perm {
      position: absolute; inset: auto 0 120px 0; z-index: 5;
      display: flex; justify-content: center;
    }
    #perm button {
      border: none; border-radius: 22px; padding: 10px 22px;
      background: rgba(20,26,36,.85); color: #fff; font-size: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #hint {
      position: absolute; top: 70px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,.85); font-size: 12px; z-index: 5;
      text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="phone">
      <div id="fallback">
        <div class="wall"></div>
        <div class="floor-persp"></div>
      </div>
      <video id="cam" autoplay muted playsinline></video>
      <div id="navi"></div>
      <div id="hint">桌面端：按住拖拽 = 转头 · 空格 = 重新播放</div>
      <div id="perm"><button id="camBtn">开启摄像头（AR 背景）</button></div>
    </div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
